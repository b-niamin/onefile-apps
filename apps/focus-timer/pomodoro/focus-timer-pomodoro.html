<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Focus Timer</title>
<style>
/* Focus timer: one dial with minute ticks, like a kitchen timer; the colored arc is the time left. Stats are a quiet second tab. */
:root {
  --bg: #F2F3F5; --surface: #FFFFFF; --ink: #15171C; --muted: #5B606B; --line: #D9DCE2; --cell: #E4E6EB;
  --focus-c: #2F55B8; --short-c: #1F7A5C; --long-c: #6A46B5;
  --accent: var(--phase, #2F55B8); --accent-ink: #FFFFFF; --accent-soft: #DCE3F4; --danger: #B42318; --focus: #2457C5;
  --tick: #B9BEC8;
  --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216; --surface: #191C22; --ink: #E8EAEE; --muted: #A1A6B1; --line: #2A2E36; --cell: #23272F;
    --focus-c: #8EA9FF; --short-c: #4FD1A1; --long-c: #BBA0F5;
    --accent-ink: #14161A; --accent-soft: #1E2A44; --danger: #F48B80; --focus: #8DB2FF; --tick: #444A55;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--accent); color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px;
}
.topbar h1 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 4px; flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-size: 0.9375rem; font-weight: 600;
  white-space: nowrap; touch-action: manipulation;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--cell); }
.btn.small { min-height: 44px; padding: 0 12px; font-size: 0.875rem; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn { width: 44px; padding: 0; }
.btn.wide { width: 100%; }

.seg { display: inline-flex; background: var(--cell); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  border: 0; background: transparent; min-height: 44px; padding: 0 16px; border-radius: 8px;
  font-size: 0.875rem; font-weight: 600; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }

.notice {
  display: flex; gap: 8px; align-items: center;
  background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 4px 4px 4px 16px; font-size: 0.875rem;
}
.notice span { flex: 1; min-width: 0; }
.notice.warn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; }

/* Bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar > div { max-width: 600px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabbar button {
  border: 0; background: transparent; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.fab {
  position: fixed; z-index: 8; right: max(16px, calc(50vw - 284px));
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 18px; border: 0;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  box-shadow: 0 6px 18px rgb(0 0 0 / .22);
}
.fab svg { width: 26px; height: 26px; }
.fab.no-tabs { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* Sheets */
dialog {
  border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
  width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow-y: auto;
  box-shadow: 0 24px 60px rgb(0 0 0 / .3);
}
dialog::backdrop { background: rgb(8 12 20 / .5); }
.dlg { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px -8px -4px 0; }
dialog h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -0.01em; }
dialog h3 { margin: 0; font-size: 0.9375rem; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > legend { font-size: 0.875rem; font-weight: 600; padding: 0; }
.row { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 120px; }
.hint { font-size: 0.8125rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.err { color: var(--danger); font-size: 0.875rem; margin: 0; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px;
  padding: 9px 12px; font-size: 1rem; min-width: 0;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { min-height: 88px; resize: vertical; line-height: 1.4; }
textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1rem; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.dlg-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dlg-actions .spacer { flex: 1; }
.section { display: flex; flex-direction: column; gap: 8px; padding-top: 24px; border-top: 1px solid var(--line); }
label.btn { cursor: pointer; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-in:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.swatches label { position: relative; width: 44px; height: 44px; display: grid; place-items: center; }
.swatches input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.swatches span { display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--c); }
.swatches input:checked + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.swatches input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 5px; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.875rem; font-weight: 600;
  max-width: calc(100vw - 32px); z-index: 30; box-shadow: 0 6px 18px rgb(0 0 0 / .2);
}
.empty { padding: 32px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; }

@media (max-width: 560px) {
  dialog {
    width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 18px 18px 0 0;
    max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  dialog[open] { animation: sheet-up .22s cubic-bezier(.2,.8,.2,1); }
}
@keyframes sheet-up { from { transform: translateY(40px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* The whole room takes the color of the current phase: blue = work, green = short break, violet = long break. */
:root[data-phase="focus"] { --phase: var(--focus-c); --bg: #E3EAFA; --cell: #D0DBF4; --line: #BFCDEE; --tick: #9FB2E0; --muted: #4A5675; --accent-soft: #CDD9F5; }
:root[data-phase="short"] { --phase: var(--short-c); --bg: #DFF2E8; --cell: #C9E7D7; --line: #B3DCC7; --tick: #8FC5A9; --muted: #45604F; --accent-soft: #C6E6D5; }
:root[data-phase="long"] { --phase: var(--long-c); --bg: #ECE5FA; --cell: #DCD1F4; --line: #CDBFEE; --tick: #AE9BDD; --muted: #574D70; --accent-soft: #DCD0F5; }
@media (prefers-color-scheme: dark) {
  :root[data-phase="focus"] { --bg: #0E1628; --surface: #16213A; --cell: #1E2C4B; --line: #283A5F; --tick: #3B5182; --muted: #A3B0CC; --accent-soft: #1E2C4B; }
  :root[data-phase="short"] { --bg: #0B1A14; --surface: #12261D; --cell: #193326; --line: #224431; --tick: #346650; --muted: #9EBDAD; --accent-soft: #193326; }
  :root[data-phase="long"] { --bg: #161129; --surface: #201A3A; --cell: #2A2249; --line: #352C5A; --tick: #514487; --muted: #B3A9CF; --accent-soft: #2A2249; }
}
body, .topbar, body::before { transition: background-color .5s ease; }
@media (prefers-reduced-motion: reduce) { body, .topbar, body::before { transition: none; } }
.dial-wrap::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 36px color-mix(in srgb, var(--phase) 22%, transparent); }
.dial-wrap > * { position: relative; }
.dial-center { position: absolute; }
.time { color: var(--ink); }
.running .time { color: var(--phase); }
.topbar .phases { flex: 1 1 auto; min-width: 0; max-width: 360px; }
.phases button { flex: 1 1 0; min-width: 0; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phases button[aria-pressed="true"] { color: var(--phase); font-weight: 700; }

#timerView { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 4px; }
.dial-wrap { position: relative; width: min(100%, 340px, 52dvh); aspect-ratio: 1; }
.dial { width: 100%; height: 100%; display: block; }
.dial .tick { stroke: var(--tick); stroke-width: 1.2; stroke-linecap: round; }
.dial .tick.major { stroke: var(--muted); stroke-width: 2.2; }
.dial .tick.done { stroke: var(--phase); opacity: .35; }
.arc-bg { fill: none; stroke: var(--cell); stroke-width: 10; }
.arc { fill: none; stroke: var(--phase); stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 110px 110px; stroke-dasharray: 1000; transition: stroke-dashoffset .4s linear, stroke .3s; }
.dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.time { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 17vw, 4.6rem); letter-spacing: -0.03em; line-height: 1; }
.paused .time { color: var(--muted); }
.cycle { display: flex; gap: 8px; }
.cycle i { width: 9px; height: 9px; border-radius: 50%; background: var(--cell); box-shadow: inset 0 0 0 1.5px var(--tick); }
.cycle i.on { background: var(--phase); box-shadow: none; }

.task { width: min(100%, 340px); }
.task input { text-align: center; background: transparent; border-color: transparent; border-bottom: 1px solid var(--line); border-radius: 0; font-weight: 600; }
.task input:focus { border-radius: 10px; }
.controls { display: flex; align-items: center; justify-content: center; gap: 24px; }
.controls .round { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 1px solid transparent; }
.controls .round svg { width: 22px; height: 22px; }
.controls .main { min-width: 132px; height: 64px; border-radius: 32px; font-size: 1.125rem; gap: 8px; }
.controls .main svg { width: 22px; height: 22px; }
.today-line { margin: 0; color: var(--muted); font-size: 0.875rem; text-align: center; }
.today-line b { color: var(--ink); }

/* Stats */
#statsView { display: flex; flex-direction: column; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .chg { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.8125rem; color: var(--muted); }
.panel { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel h2 { margin: 0; font-size: 0.9375rem; font-weight: 650; }
.panel .sub { font-size: 0.8125rem; color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 140px; }
.bars .b { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.bars .v { font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .col { width: 100%; max-width: 34px; border-radius: 6px 6px 3px 3px; background: var(--tick); min-height: 2px; }
.bars .b.today .col { background: var(--phase); }
.bars .col.zero { background: var(--cell); }
.bars .goal-met { box-shadow: inset 0 3px 0 rgb(255 255 255 / .55); }
.bars .d { font-size: 0.75rem; color: var(--muted); }
.bars .b.today .d { color: var(--ink); font-weight: 700; }
.week-nav { display: flex; align-items: center; gap: 2px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto 44px; gap: 8px; align-items: center; min-height: 44px; border-top: 1px solid var(--line); font-size: 0.9375rem; }
.log li:first-child { border-top: 0; }
.log .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8125rem; }
.log .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .lb.none { color: var(--muted); }
.log .mn { font-variant-numeric: tabular-nums; font-weight: 600; }
.log-day { font-size: 0.8125rem; font-weight: 650; color: var(--muted); margin: 8px 0 0; }
.goal-bar { height: 8px; border-radius: 99px; background: var(--cell); overflow: hidden; }
.goal-bar span { display: block; height: 100%; background: var(--phase); border-radius: inherit; }
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-weight: 600; font-size: 0.9375rem; }
.toggle input { width: 22px; height: 22px; accent-color: var(--phase); }
@media (max-height: 640px) { .dial-wrap { width: min(100%, 260px, 48dvh); } .controls .main { height: 56px; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="topbar">
    <div class="seg phases" role="group" id="phaseSeg">
      <button type="button" data-phase="focus"></button>
      <button type="button" data-phase="short"></button>
      <button type="button" data-phase="long"></button>
    </div>
    <div class="tools">
      <button type="button" class="btn quiet icon-btn" id="settingsBtn" data-icon="more"></button>
    </div>
  </header>
  <div id="banners"></div>
  <main id="timerView">
    <div class="dial-wrap">
      <svg class="dial" id="dial" viewBox="0 0 220 220" role="img" aria-labelledby="timeText">
        <g id="ticks"></g>
        <circle class="arc-bg" cx="110" cy="110" r="84"></circle>
        <circle class="arc" id="arc" cx="110" cy="110" r="84" pathLength="1000"></circle>
      </svg>
      <div class="dial-center">
        <div class="time num" id="timeText" aria-live="off"></div>
        <div class="cycle" id="cycleDots" aria-hidden="true"></div>
      </div>
    </div>
    <div class="task">
      <label class="vh" for="taskInput" id="taskLabel"></label>
      <input type="text" id="taskInput" maxlength="60" autocomplete="off">
    </div>
    <div class="controls">
      <button type="button" class="btn quiet icon-btn round" id="resetBtn" data-icon="reset"></button>
      <button type="button" class="btn primary main" id="startBtn"></button>
      <button type="button" class="btn quiet icon-btn round" id="skipBtn" data-icon="skip"></button>
    </div>
    <p class="today-line num" id="todayLine"></p>
    <p class="vh" aria-live="polite" id="announce"></p>
  </main>
  <main id="statsView" hidden></main>
</div>
<nav class="tabbar" id="tabbar"><div>
  <button type="button" id="tabTimer" data-icon="clock" data-view="timer"><span></span></button>
  <button type="button" id="tabStats" data-icon="chart" data-view="stats"><span></span></button>
</div></nav>

<script>
(() => {
  "use strict";
  /* ---------- helpers: DOM, text, dates ---------- */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const pluralPl = (n, one, few, many) => {
    n = Math.abs(n);
    if (n === 1) return one;
    const m10 = n % 10, m100 = n % 100;
    return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? few : many;
  };
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
    return n;
  }
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    more: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    close: '<path d="M6 6l12 12M18 6 6 18"/>',
    left: '<path d="m15 5-7 7 7 7"/>',
    right: '<path d="m9 5 7 7-7 7"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    trash: '<path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 12.5h9l1-12.5"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
