<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Flashcards</title>
<style>
/* Flashcards: a ruled index card is the one bold element; it flips to the answer and four grade buttons show when you will see it again. */
:root {
  --bg: #F3F2F8; --surface: #FFFFFF; --ink: #17162B; --muted: #5A5873; --line: #DEDCEA; --cell: #E8E6F1;
  --accent: #3B35A8; --accent-ink: #FFFFFF; --accent-soft: #E1DFF7; --danger: #B42318; --focus: #3B35A8;
  --night: #0E0D1A; --night-ink: #F4F3FA; --night-muted: #A9A7C2;
  --tile-ink: #121120; --tile-muted: rgb(18 17 32 / .72);
  --again: #B42318; --hard: #9A5B00; --good: #1F6F43; --easy: #3B35A8;
  --d0: #FFD43B; --d1: #7BE07F; --d2: #FF8A80; --d3: #7CCBFF; --d4: #B8A8FF; --d5: #FFA95C;
  --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15142A; --surface: #201F3C; --ink: #EEEDF7; --muted: #A9A7C2; --line: #2E2C50; --cell: #2A2847;
    --accent: #ADA8FF; --accent-ink: #15142A; --accent-soft: #2E2C55; --danger: #F48B80; --focus: #ADA8FF;
    --night: #09081A;
    --again: #FF9A8F; --hard: #F3C266; --good: #7FD9A4; --easy: #ADA8FF;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--accent); color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px;
}
.topbar h1 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 4px; flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-size: 0.9375rem; font-weight: 600;
  white-space: nowrap; touch-action: manipulation;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); background: var(--cell); }
.btn.small { min-height: 44px; padding: 0 12px; font-size: 0.875rem; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn { width: 44px; padding: 0; }
.btn.wide { width: 100%; }

.seg { display: inline-flex; background: var(--cell); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  border: 0; background: transparent; min-height: 44px; padding: 0 16px; border-radius: 8px;
  font-size: 0.875rem; font-weight: 600; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }

.notice {
  display: flex; gap: 8px; align-items: center;
  background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 4px 4px 4px 16px; font-size: 0.875rem;
}
.notice span { flex: 1; min-width: 0; }
.notice.warn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; }

/* Bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar > div { max-width: 600px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabbar button {
  border: 0; background: transparent; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.fab {
  position: fixed; z-index: 8; right: max(16px, calc(50vw - 284px));
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 18px; border: 0;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  box-shadow: 0 6px 18px rgb(0 0 0 / .22);
}
.fab svg { width: 26px; height: 26px; }
.fab.no-tabs { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* Sheets */
dialog {
  border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
  width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow-y: auto;
  box-shadow: 0 24px 60px rgb(0 0 0 / .3);
}
dialog::backdrop { background: rgb(8 12 20 / .5); }
.dlg { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px -8px -4px 0; }
dialog h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -0.01em; }
dialog h3 { margin: 0; font-size: 0.9375rem; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > legend { font-size: 0.875rem; font-weight: 600; padding: 0; }
.row { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 120px; }
.hint { font-size: 0.8125rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.err { color: var(--danger); font-size: 0.875rem; margin: 0; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px;
  padding: 9px 12px; font-size: 1rem; min-width: 0;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { min-height: 88px; resize: vertical; line-height: 1.4; }
textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1rem; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.dlg-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dlg-actions .spacer { flex: 1; }
.section { display: flex; flex-direction: column; gap: 8px; padding-top: 24px; border-top: 1px solid var(--line); }
label.btn { cursor: pointer; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-in:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.swatches label { position: relative; width: 44px; height: 44px; display: grid; place-items: center; }
.swatches input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.swatches span { display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--c); }
.swatches input:checked + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.swatches input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 5px; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.875rem; font-weight: 600;
  max-width: calc(100vw - 32px); z-index: 30; box-shadow: 0 6px 18px rgb(0 0 0 / .2);
}
.empty { padding: 32px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; }

@media (max-width: 560px) {
  dialog {
    width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 18px 18px 0 0;
    max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  dialog[open] { animation: sheet-up .22s cubic-bezier(.2,.8,.2,1); }
}
@keyframes sheet-up { from { transform: translateY(40px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.summary-line { margin: -4px 0 0; color: var(--muted); font-size: 0.9375rem; }
.summary-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.decks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.deck { background: var(--dc); color: var(--tile-ink); border-radius: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 12px 8px 0; }
.deck .open { all: unset; box-sizing: border-box; cursor: pointer; padding: 16px 8px 16px 20px; min-height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0; border-radius: 10px; }
.deck .open:focus-visible { outline: 2px solid var(--tile-ink); }
.deck .nm { font-family: var(--font-display); font-weight: 750; font-size: 1.25rem; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck .counts { display: flex; gap: 16px; font-size: 0.875rem; color: var(--tile-muted); font-variant-numeric: tabular-nums; }
.deck .counts b { font-weight: 700; }
.deck .counts b { color: var(--tile-ink); }
.deck .btn { min-width: 96px; border-radius: 99px; background: rgb(255 255 255 / .55); border-color: transparent; color: var(--tile-ink); }
.deck .btn.primary { background: var(--tile-ink); color: #FFFFFF; }
.deck .btn:disabled { opacity: .5; }
.add-deck { align-self: flex-start; }

/* Study: the screen is the card. Front = flat deck color, black type. Answer = night screen. */
.study { position: fixed; inset: 0; z-index: 20; overflow-y: auto; --sc: var(--d4); background: var(--sc); color: var(--tile-ink); transition: background-color .35s ease, color .35s ease; color-scheme: light; }
.study.flipped { background: var(--night); color: var(--night-ink); color-scheme: dark; }
.study-in { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.study-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.study .btn.quiet { color: inherit; opacity: .8; }
.study .btn.quiet:hover { opacity: 1; background: rgb(127 127 127 / .16); }
.study-meta { display: flex; flex-direction: column; align-items: center; min-width: 0; font-size: 0.875rem; }
.study-meta span:first-child { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
.study-meta span:last-child { opacity: .75; font-size: 0.8125rem; }
.progress { height: 4px; border-radius: 99px; background: rgb(127 127 127 / .25); overflow: hidden; }
.progress span { display: block; height: 100%; background: currentColor; border-radius: inherit; transition: width .3s ease; }
.stage { flex: 1; display: flex; min-height: 280px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; position: relative; width: 100%; min-height: 280px; flex: 1; }
.card:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 16px; }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 8px; overflow: auto; text-align: left;
  transition: opacity .25s ease, transform .35s cubic-bezier(.3,.7,.2,1); }
.face.back { opacity: 0; transform: translateY(16px); pointer-events: none; }
.card.flipped .face.front { opacity: 0; transform: translateY(-16px); pointer-events: none; }
.card.flipped .face.back { opacity: 1; transform: none; pointer-events: auto; }
.face .txt { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.25rem, 11vw, 3.5rem); line-height: 1.05; letter-spacing: -0.025em; white-space: pre-wrap; overflow-wrap: anywhere; hyphens: auto; }
.face.back .txt { font-size: clamp(1.9rem, 9vw, 3rem); }
.face .q { font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; color: var(--night-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { min-height: 72px; display: flex; align-items: flex-end; }
.answer .show { width: 100%; min-height: 60px; font-size: 1.0625rem; border-radius: 99px; background: var(--tile-ink); border-color: var(--tile-ink); color: #FFFFFF; }
.grades { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { border: 0; background: rgb(255 255 255 / .08); color: var(--night-ink); border-radius: 20px; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 2px; cursor: pointer; }
.grade::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
.grade b { font-size: 0.9375rem; }
.grade span { font-size: 0.75rem; color: var(--night-muted); font-variant-numeric: tabular-nums; }
.grade:hover { background: rgb(255 255 255 / .14); }
.grade.again { --gc: #FF8A80; } .grade.hard { --gc: #FFD43B; } .grade.good { --gc: #7BE07F; } .grade.easy { --gc: #7CCBFF; }
.done { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 16px; }
.done h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.25rem, 11vw, 3.25rem); line-height: 1.05; letter-spacing: -0.025em; }
.done p { margin: 0; font-size: 1.0625rem; opacity: .8; }
.done .btn.primary { background: var(--tile-ink); border-color: var(--tile-ink); color: #FFFFFF; border-radius: 99px; min-width: 140px; }
body.studying { overflow: hidden; }

/* Cards list */
.filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.cardlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; }
.cardlist li + li { border-top: 1px solid var(--line); }
.cardlist button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 12px 16px; min-height: 56px; }
.cardlist button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 14px; }
.cardlist .f { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cardlist .b { color: var(--muted); font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cardlist .st { font-size: 0.75rem; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cardlist .st.new { color: var(--good); font-weight: 650; }
.cardlist .st.due { color: var(--accent); font-weight: 650; }
.list-tools { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.more { text-align: center; }

/* Stats */
.panel { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.panel h2 { margin: 0; font-size: 0.9375rem; font-weight: 650; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .chg { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.8125rem; color: var(--muted); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; align-items: end; height: 120px; }
.bars .b { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; min-width: 0; }
.bars .col { width: 100%; max-width: 26px; background: var(--muted); opacity: .45; border-radius: 4px 4px 2px 2px; min-height: 2px; }
.bars .b.now .col { background: var(--accent); opacity: 1; }
.bars .col.zero { background: var(--cell); }
.bars .v { font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .d { font-size: 0.6875rem; color: var(--muted); }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--cell); gap: 2px; }
.stack span { background: var(--sc); min-width: 3px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 0.875rem; }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.legend b { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .face, .study { transition: none; } }
.deck .counts { flex-wrap: wrap; gap: 4px 12px; }
.deck .counts > span { white-space: nowrap; }
@media (max-width: 360px) { .deck .open { padding-left: 16px; } .deck .nm { font-size: 1.125rem; } .deck .btn { min-width: 0; padding: 0 16px; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="topbar">
    <h1 id="title"></h1>
    <div class="tools">
      <button type="button" class="btn quiet icon-btn" id="settingsBtn" data-icon="more"></button>
    </div>
  </header>
  <div id="banners"></div>
  <main id="decksView"></main>
  <main id="cardsView" hidden></main>
  <main id="statsView" hidden></main>
</div>
<button type="button" class="fab" id="fab" data-icon="plus"></button>
<nav class="tabbar" id="tabbar"><div>
  <button type="button" id="tabDecks" data-icon="cards" data-view="decks"><span></span></button>
  <button type="button" id="tabCards" data-icon="list" data-view="cards"><span></span></button>
  <button type="button" id="tabStats" data-icon="chart" data-view="stats"><span></span></button>
</div></nav>

<section id="study" class="study" hidden aria-labelledby="studyTitle">
  <div class="study-in">
    <div class="study-top">
      <button type="button" class="btn quiet icon-btn" id="studyClose" data-icon="close"></button>
      <div class="study-meta"><span id="studyTitle"></span><span class="num" id="studyCount"></span></div>
      <button type="button" class="btn quiet icon-btn" id="studyEdit" data-icon="edit"></button>
    </div>
    <div class="progress" aria-hidden="true"><span id="studyBar"></span></div>
    <div class="stage" id="stage">
      <button type="button" class="card" id="card" aria-live="polite">
        <span class="face front"><span class="txt" id="cardFront"></span></span>
        <span class="face back"><span class="q" id="cardQ"></span><span class="txt" id="cardBack"></span></span>
      </button>
    </div>
    <div class="answer" id="answerBar">
      <button type="button" class="btn primary show" id="showBtn"></button>
      <div class="grades" id="grades" hidden>
        <button type="button" class="grade again" data-g="0"><b></b><span></span></button>
        <button type="button" class="grade hard" data-g="1"><b></b><span></span></button>
        <button type="button" class="grade good" data-g="2"><b></b><span></span></button>
        <button type="button" class="grade easy" data-g="3"><b></b><span></span></button>
      </div>
    </div>
    <div class="done" id="doneBox" hidden></div>
  </div>
</section>

<dialog id="cardDlg" aria-labelledby="cardDlgT">
  <form class="dlg" id="cardForm" novalidate>
    <div class="dlg-head"><h2 id="cardDlgT"></h2><button type="button" class="btn quiet icon-btn" data-close data-icon="close" id="cardX"></button></div>

<script>
(() => {
  "use strict";
  /* ---------- helpers: DOM, text, dates ---------- */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const pluralPl = (n, one, few, many) => {
    n = Math.abs(n);
    if (n === 1) return one;
    const m10 = n % 10, m100 = n % 100;
    return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? few : many;
  };
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));

    return n;
  }
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    more: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    close: '<path d="M6 6l12 12M18 6 6 18"/>',
    left: '<path d="m15 5-7 7 7 7"/>',
    right: '<path d="m9 5 7 7-7 7"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    trash: '<path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 12.5h9l1-12.5"/>',

    list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    history: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.7"/><path d="M4 4v4.7h4.7M12 8v4l3 2"/>',
    play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',

    skip: '<path d="M5 5v14l10-7zM19 5v14"/>',

    cards: '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
    flip: '<path d="M4 9h13l-3-3M20 15H7l3 3"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4.5v1A3.5 3.5 0 0 0 8 10.5M16 6h3.5v1a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8 20h8M9.5 17h5"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',

  function icon(name, extra) {

    s.setAttribute("aria-hidden", "true");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "2");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");
    if (extra) s.setAttribute("class", extra);
    s.innerHTML = ICONS[name] || "";
    return s;
  }
  function fillIcons(root) {
    (root || document).querySelectorAll("[data-icon]").forEach((n) => {
      if (!n.querySelector("svg")) n.prepend(icon(n.dataset.icon));

  }
  const cleanText = (v, max) => typeof v === "string" ? v.replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, " ").trim().slice(0, max) : "";
  const cleanLine = (v, max) => cleanText(v, max).replace(/\s+/g, " ");
  const isId = (v) => typeof v === "string" && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  function uid(p) {
    try { return (p || "i") + Array.from(crypto.getRandomValues(new Uint32Array(2)), (n) => n.toString(36)).join(""); }
    catch (e) { return (p || "i") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  }
  const pad = (n) => String(n).padStart(2, "0");
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const validKey = (k) => typeof k === "string" && DATE_RE.test(k) && keyOf(parseKey(k)) === k;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const todayKey = () => keyOf(new Date());
  const dayDiff = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
  const clampInt = (v, lo, hi, dflt) => Number.isInteger(v) && v >= lo && v <= hi ? v : dflt;

  /* ---------- storage that survives being blocked ---------- */
  const Store = {
    ok: true,
    read(key) { try { return localStorage.getItem(key); } catch (e) { this.ok = false; return null; } },
    write(key, val) { try { localStorage.setItem(key, val); this.ok = true; } catch (e) { this.ok = false; } },
  };

  /* ---------- kit strings ---------- */
  const KT = {
    en: {
      settings: "Settings", close: "Close", language: "Language",
      backup: "Backup", backupHint: "Copy or download a backup to keep it safe or move it to another device.",
      copyJson: "Copy backup", dlJson: "Download .json", copyCsv: "Copy CSV", dlCsv: "Download .csv",
      copied: "Copied", copyFail: "Copy failed. The text is selected: copy it by hand.",
      dlStarted: "Download started. If nothing happens, use Copy.",
      importTitle: "Import", importHint: "Choose a backup file or paste its text.",
      chooseFile: "Choose file", pastePh: "Paste backup text here", check: "Check",
      importBad: "This isn’t a backup from this app, or the text is incomplete.",
      importEmpty: "Choose a file or paste a backup first.",
      merge: "Merge", replace: "Replace", replaceArmed: "Replace all?",
      startOver: "Start over", loadSample: "Load example data", deleteAll: "Delete all data", deleteArmed: "Delete everything?",
      deleted: "All data deleted", sampleLoaded: "Example data loaded", imported: "Imported",
      privacy: "Your data is saved only in this browser. Nothing is sent anywhere.",
      storageOff: "This browser blocks saving. Copy a backup before you close the page.",
      example: "Example data", clear: "Clear",
      version: (v) => `Version ${v}`,
      cancel: "Cancel", save: "Save", del: "Delete", delArmed: "Delete?",
    },
    pl: {
      settings: "Ustawienia", close: "Zamknij", language: "Język",
      backup: "Kopia zapasowa", backupHint: "Skopiuj lub pobierz kopię, żeby ją zachować albo przenieść na inne urządzenie.",
      copyJson: "Kopiuj kopię", dlJson: "Pobierz .json", copyCsv: "Kopiuj CSV", dlCsv: "Pobierz .csv",
      copied: "Skopiowano", copyFail: "Nie udało się skopiować. Tekst jest zaznaczony: skopiuj go ręcznie.",
      dlStarted: "Pobieranie rozpoczęte. Jeśli nic się nie dzieje, użyj Kopiuj.",
      importTitle: "Import", importHint: "Wybierz plik kopii albo wklej jej treść.",
      chooseFile: "Wybierz plik", pastePh: "Wklej tu tekst kopii", check: "Sprawdź",
      importBad: "To nie jest kopia z tej aplikacji albo tekst jest niepełny.",
      importEmpty: "Najpierw wybierz plik albo wklej kopię.",
      merge: "Połącz", replace: "Zastąp", replaceArmed: "Zastąpić wszystko?",
      startOver: "Od nowa", loadSample: "Wczytaj przykładowe dane", deleteAll: "Usuń wszystkie dane", deleteArmed: "Usunąć wszystko?",
      deleted: "Usunięto wszystkie dane", sampleLoaded: "Wczytano przykładowe dane", imported: "Zaimportowano",
      privacy: "Dane są zapisane tylko w tej przeglądarce. Nic nie jest nigdzie wysyłane.",
      storageOff: "Ta przeglądarka blokuje zapis. Skopiuj kopię przed zamknięciem strony.",
      example: "Przykładowe dane", clear: "Wyczyść",
      version: (v) => `Wersja ${v}`,
      cancel: "Anuluj", save: "Zapisz", del: "Usuń", delArmed: "Usunąć?",
    },
  };

  /* ---------- toast, sheets, two-tap confirm ---------- */
  let toastTimer = 0;
  function toast(msg) {
    let n = $("toast");
    if (!n) { n = el("div", { id: "toast", class: "toast", role: "status", "aria-live": "polite" }); document.body.append(n); }
    n.textContent = msg; n.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { n.hidden = true; }, 2600);
  }
  function openSheet(dlg) {
    if (dlg.open) return;
    dlg.showModal();
    const first = dlg.querySelector("[autofocus]");
    if (first) first.focus();
  }
  function closeSheet(dlg) { if (dlg.open) dlg.close(); }
  document.addEventListener("click", (e) => {
    if (e.target instanceof HTMLDialogElement && e.target.open) {
      const r = e.target.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close();
    }
    const c = e.target.closest("[data-close]");
    if (c) { const d = c.closest("dialog"); if (d) d.close(); }
  });
  // Two taps for anything destructive: the first arms the button for 3 s.
  function armed(btn, armedText, action) {
    if (btn.classList.contains("armed")) {
      btn.classList.remove("armed"); clearTimeout(btn._armT); btn.textContent = btn._label; action(); return;
    }
    btn._label = btn.textContent;
    btn.classList.add("armed"); btn.textContent = armedText;
    btn._armT = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = btn._label; }, 3000);
  }
  function dlgHead(titleId) {
    return el("div", { class: "dlg-head" },
      el("h2", { id: titleId }),
      el("button", { type: "button", class: "btn quiet icon-btn", "data-close": true, "aria-label": "Close", "data-kclose": true }, icon("close")));
  }

  /* ---------- copy, download, CSV ---------- */
  async function copyText(text, area) {
    try { await navigator.clipboard.writeText(text); toast(t().copied); return true; }
    catch (e) {
      if (area) { area.value = text; area.hidden = false; area.focus(); area.select(); }
      try { if (document.execCommand && document.execCommand("copy")) { toast(t().copied); return true; } } catch (e2) { /* ignore */ }
      toast(t().copyFail); return false;
    }
  }
  function download(name, text, mime) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime }));
      const a = el("a", { href: url, download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(t().dlStarted);
    } catch (e) { toast(t().dlStarted); }
  }
  function csvCell(v) {
    let s = v == null ? "" : String(v);
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s;
    return /[",;\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  const toCsv = (rows) => rows.map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
  function parseCsv(text) {
    text = String(text).replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0] || "";
    const counts = { "\t": first.split("\t").length, ";": first.split(";").length, ",": first.split(",").length };
    const sep = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === "") q = true;
      else if (c === sep) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
      if (rows.length > 20000) break;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }
  const readFile = (file) => new Promise((res, rej) => {
    if (!file || file.size > 5 * 1024 * 1024) return rej(new Error("size"));

  });

  /* ---------- settings sheet: language, backup, import, reset ---------- */
  // cfg: { version, fileBase, exportJson(), csv?(), parseImport(obj) -> {label, merge(), replace()} | null,
  //        clearAll(), loadSample(), extra?(container), setLang(l) }
  function buildSettings(cfg) {
    const dlg = el("dialog", { id: "settingsDlg", "aria-labelledby": "setTitle" });
    const box = el("div", { class: "dlg" });
    dlg.append(box);
    document.body.append(dlg);
    let pending = null;
    function render() {
      const s = t();
      box.replaceChildren();
      const head = dlgHead("setTitle"); head.querySelector("h2").textContent = s.settings;
      head.querySelector("button").setAttribute("aria-label", s.close);
      box.append(head);
      const langSeg = el("div", { class: "seg", role: "group", "aria-label": s.language },
        ...[["en", "English"], ["pl", "Polski"]].map(([l, name]) => el("button", {

      const bk = el("div", { class: "section" },
        el("h3", { text: s.backup }), el("p", { class: "hint", text: s.backupHint }),
        el("div", { class: "row" },
          el("button", { type: "button", class: "btn primary", text: s.copyJson, onclick: () => copyText(JSON.stringify(cfg.exportJson(), null, 1), area) }),
          el("button", { type: "button", class: "btn", text: s.dlJson, onclick: () => download(`${cfg.fileBase}-${todayKey()}.json`, JSON.stringify(cfg.exportJson(), null, 1), "application/json") })),
        cfg.csv ? el("div", { class: "row" },
          el("button", { type: "button", class: "btn", text: s.copyCsv, onclick: () => copyText(cfg.csv(), area) }),
          el("button", { type: "button", class: "btn", text: s.dlCsv, onclick: () => download(`${cfg.fileBase}-${todayKey()}.csv`, "﻿" + cfg.csv(), "text/csv") })) : null,
        area);
      box.append(bk);

      const paste = el("textarea", { class: "code", rows: 3, placeholder: s.pastePh, "aria-label": s.pastePh });
      const msg = el("p", { class: "hint", role: "status" });
      const actions = el("div", { class: "row", hidden: true });
      const file = el("input", { type: "file", id: "importFile", class: "file-in", accept: ".json,application/json,.txt" });
      const check = (text) => {
        actions.hidden = true; pending = null; msg.classList.remove("err");
        if (!text.trim()) { msg.textContent = s.importEmpty; msg.classList.add("err"); return; }
        let obj = null; try { obj = JSON.parse(text); } catch (e) { obj = null; }
        const res = obj ? cfg.parseImport(obj) : null;
        if (!res) { msg.textContent = s.importBad; msg.classList.add("err"); return; }
        pending = res; msg.textContent = res.label; actions.hidden = false;
      };
      file.addEventListener("change", async () => {
        try { const text = await readFile(file.files[0]); paste.value = text.slice(0, 200000); check(text); }
        catch (e) { msg.textContent = s.importBad; msg.classList.add("err"); }
        file.value = "";
      });
      const done = () => { toast(s.imported); paste.value = ""; msg.textContent = ""; actions.hidden = true; pending = null; };
      actions.append(
        el("button", { type: "button", class: "btn primary", text: s.merge, onclick: () => { if (pending) { pending.merge(); done(); } } }),
        el("button", { type: "button", class: "btn danger", text: s.replace, onclick: (e) => armed(e.currentTarget, s.replaceArmed, () => { if (pending) { pending.replace(); done(); } }) }));
      box.append(el("div", { class: "section" },
        el("h3", { text: s.importTitle }), el("p", { class: "hint", text: s.importHint }),
        el("div", { class: "row" }, file, el("label", { for: "importFile", class: "btn", text: s.chooseFile }),
          el("button", { type: "button", class: "btn", text: s.check, onclick: () => check(paste.value) })),
        paste, msg, actions));

      box.append(el("div", { class: "section" },
        el("h3", { text: s.startOver }),
        el("div", { class: "row" },
          el("button", { type: "button", class: "btn", text: s.loadSample, onclick: () => { cfg.loadSample(); toast(s.sampleLoaded); closeSheet(dlg); } }),
          el("button", { type: "button", class: "btn danger", text: s.deleteAll, onclick: (e) => armed(e.currentTarget, s.deleteArmed, () => { cfg.clearAll(); toast(s.deleted); closeSheet(dlg); }) })),
        el("p", { class: "hint", text: s.privacy }),
        el("p", { class: "hint", text: s.version(cfg.version) })));
    }
    return { open() { render(); openSheet(dlg); }, render, dlg };
  }

  // One-line banners: example data and blocked storage.
  function renderBanners(host, onClearSample) {
    const s = t();
    host.replaceChildren();
    if (!Store.ok) host.append(el("div", { class: "notice warn", role: "alert" }, el("span", { text: s.storageOff })));

  const pickLang = () => ((navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en");

  /* ================= Flashcards ================= */
  const APP_ID = "flashcards-spaced-repetition";
  const STORE_KEY = "flashcards-spaced-repetition:data";
  const VERSION = "1.0.0";
  const DATA_VERSION = 1;
  const MAX_DECKS = 100, MAX_CARDS = 20000, MAX_IVL = 3650;

  const T = {
    en: {
      appName: "Flashcards", color: "Color", decks: "Decks", cards: "Cards", stats: "Stats",
      dueNew: (d, n) => [d, " due · ", n, " new today"],
      due: "due", newC: "new", total: "cards", study: "Study", studyAll: "Study all", nothing: "Done",
      addDeck: "New deck", editDeck: "Edit deck", deckName: "Deck name", deckPh: "Spanish verbs", deckErr: "Give the deck a name.",
      deckExists: "A deck with this name already exists.", deleteDeck: "Delete deck", deckDeleted: "Deck deleted",

      $("cardCount").textContent = `${nf(items.length)} ${s.total}`;

  }
  function streak() {

  }
  function renderStats() {
    const s = t(), host = $("statsView");

    for (let i = 0; i < 60; i++) { const e = state.log[keyOf(addDays(new Date(), -i))]; if (!e) continue; if (i < 30) { r30 += e.r; ok30 += e.ok; } else { rp += e.r; okp += e.ok; } }

    host.append(el("div", { class: "kpis" },
      el("div", { class: "kpi" }, el("b", { text: nf(today.r) }), el("span", { text: s.reviewsToday }), el("span", { class: "chg", text: s.vsYesterday(signed(today.r - yR)) })),
      el("div", { class: "kpi" }, el("b", { text: nf(streak()) }), el("span", { text: s.streak }), el("span", { class: "chg", text: s.best(nf(best)) })),
      el("div", { class: "kpi" }, el("b", { text: ret === null ? "–" : ret + "%" }), el("span", { text: s.retention }), el("span", { class: "chg", text: s.last30(ret !== null && retP !== null ? signed(ret - retP) : "–") }))));
    const wd = new Intl.DateTimeFormat(locale(), { weekday: "narrow" });
    const days14 = Array.from({ length: 14 }, (_, i) => keyOf(addDays(new Date(), i - 13)));
    const vals = days14.map((k) => (state.log[k] || {}).r || 0);
    const max = Math.max(10, ...vals);
    host.append(el("section", { class: "panel" }, el("h2", { text: s.last14 }),
      el("div", { class: "bars", role: "img", "aria-label": days14.map((k, i) => `${df(k)}: ${vals[i]}`).join(", ") },
        ...days14.map((k, i) => el("div", { class: "b" + (k === tk ? " now" : "") }, el("span", { class: "v", text: vals[i] || "" }),
          el("span", { class: "col" + (vals[i] ? "" : " zero"), style: `height:${vals[i] ? Math.max(4, vals[i] / max * 100).toFixed(1) : 2}%` }),
          el("span", { class: "d", text: wd.format(parseKey(k)) }))))));
    const fc = Array.from({ length: 7 }, (_, i) => keyOf(addDays(new Date(), i)));
    const fv = fc.map((k, i) => state.cards.filter((c) => c.reps > 0 && (i === 0 ? c.due <= k : c.due === k)).length);
    const fmax = Math.max(5, ...fv);
    host.append(el("section", { class: "panel" }, el("h2", { text: s.forecast }),

        ...fc.map((k, i) => el("div", { class: "b" + (i === 0 ? " now" : "") }, el("span", { class: "v", text: fv[i] || "" }),
          el("span", { class: "col" + (fv[i] ? "" : " zero"), style: `height:${fv[i] ? Math.max(4, fv[i] / fmax * 100).toFixed(1) : 2}%` }),
          el("span", { class: "d", text: wd.format(parseKey(k)) }))))));
    const cnt = { n: 0, l: 0, m: 0 };
    for (const c of state.cards) { if (c.reps === 0) cnt.n++; else if (c.ivl >= 21) cnt.m++; else cnt.l++; }
    const tot = cnt.n + cnt.l + cnt.m || 1;

  }

    const id = editDeck.id;

  /* ---------- card sheet ---------- */
  const cardDlg = $("cardDlg");
  let editCard = null;
