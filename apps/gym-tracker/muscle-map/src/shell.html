<title>Gym Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gym Tracker: a private workout log that runs from one HTML file. Data stays in your browser.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
/* Barlow, Barlow Condensed: Copyright 2017 The Barlow Project Authors, SIL Open Font License 1.1 */
/*@FONTS@*/
/*@CSS@*/
</style>
<div class="wrap">
  <div id="live" class="bar-live hide"></div>
  <header class="top"><h1 id="title">Gym Tracker</h1>
    <button class="gear" data-act="open-settings" data-ta="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></header>
  <div id="notice" class="notice hide" role="status"></div>
  <main id="view"><p class="empty">Loading…</p></main>
</div>
<div class="rest" id="rest" aria-live="polite">
  <button class="fab" data-act="rest-open" data-ta="timerAria" aria-label="Timer" aria-expanded="false"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bgc" cx="32" cy="32" r="29"/><circle class="fg" id="restRing" cx="32" cy="32" r="29" stroke-dasharray="182.2" stroke-dashoffset="0"/></svg><b id="restT">1:30</b></button>
  <div class="rest-panel" role="group" data-ta="timer" aria-label="Timer">
    <button class="r" data-act="rest-adj" data-s="-15" data-ta="restSub" aria-label="15 s shorter">−15</button>
    <button class="r" data-act="rest-adj" data-s="5" data-ta="restAdd5" aria-label="5 s longer">+5 s</button>
    <button class="r" data-act="rest-adj" data-s="15" data-ta="restAdd" aria-label="15 s longer">+15</button>
    <button class="r go" data-act="rest-toggle" id="restGo">Start</button>
  </div>
</div>
<div class="rbig-bg" id="rbigBg" data-act="rest-min"></div>
<div class="rbig" id="rbig" role="dialog" data-ta="timer" aria-label="Timer">
  <div class="grab"></div>
  <div class="rbig-top"><span class="h2" data-t="timer">Timer</span><button class="btn btn-sm" data-act="rest-min" data-t="collapse">Hide</button></div>
  <div class="rbig-ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="bgc" cx="110" cy="110" r="100"/><circle class="fg" id="rbigRing" cx="110" cy="110" r="100" stroke-dasharray="628.3" stroke-dashoffset="0"/></svg><div class="rbig-t"><b id="rbigT">1:30</b><span id="rbigSub">left</span></div></div>
  <div class="rbig-btns"><button class="r" data-act="rest-adj" data-s="-15" data-ta="restSub" aria-label="15 s shorter">−15</button><button class="r" data-act="rest-adj" data-s="5" data-ta="restAdd5" aria-label="5 s longer">+5 s</button><button class="r" data-act="rest-adj" data-s="15" data-ta="restAdd" aria-label="15 s longer">+15</button></div>
  <button class="go2" data-act="rest-toggle" id="rbigGo">Skip</button>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-top"><span class="h2" id="shTitle" style="margin:0"></span><button class="btn btn-line btn-sm" data-act="sheet-close" data-t="close">Close</button></div>
  <div class="sh-head" id="shHead"></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<nav class="tabs" aria-label="Sections">
  <button data-tab="workout" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span data-t="tabWorkout">Workout</span><span class="live hide" id="liveDot"></span></button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-t="tabCal">Calendar</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg><span data-t="tabProg">Progress</span></button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span data-t="tabLib">Exercises</span></button>
</nav>
<script>
/*@JS@*/
</script>
