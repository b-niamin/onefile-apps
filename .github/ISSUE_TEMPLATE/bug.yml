name: Bug
description: Something in an app does not work
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: App and version
      description: e.g. gym-tracker/muscle-map 1.0.0 (from manifest.json)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you opened it
      description: Browser and device, or which AI chat app showed it
  - type: markdown
    attributes:
      value: Please do not paste your personal data. Security problems go through SECURITY.md, not issues.
